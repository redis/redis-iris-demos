services:
  postgres:
    image: debezium/postgres:15-alpine
    hostname: postgres
    container_name: meeting-intel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=8
      - -c
      - max_replication_slots=8
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 8
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./scripts/01-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
  pgadmin:
    image: dpage/pgadmin4
    container_name: meeting-intel-pgadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@postgres.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin4pwd
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./pgadmin:/var/lib/pgadmin

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: meeting-intel
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: debezium/postgres:15-alpine
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=8
            - -c
            - max_replication_slots=8
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: meeting-intel-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: meeting-intel-pg-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: meeting-intel
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
